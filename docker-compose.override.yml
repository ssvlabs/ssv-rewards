version: "3.8"

services:
  sync:
    # Network optimizations for slow external API calls
    sysctls:
      - net.ipv4.tcp_keepalive_time=120
      - net.ipv4.tcp_keepalive_intvl=30
      - net.ipv4.tcp_keepalive_probes=5
      - net.ipv4.tcp_fin_timeout=30
    # Use host network mode to bypass Docker networking
    network_mode: "host"  # Use host networking to avoid Docker network issues
    environment:
      # Override postgres connection for host networking
      POSTGRES: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-1234}@localhost:5435/${POSTGRES_DB:-ssv-rewards}?sslmode=disable